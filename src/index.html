<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula 1 Store</title>
    <link rel="stylesheet" href="/src/styles/styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <nav>
            <h1 class="">F1 Store</h1>
            <button class="product-cart-button">
                <svg class="product-cart-image" xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-garden-cart">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M15 17.5a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0 -5 0" />
                    <path d="M6 8v11a1 1 0 0 0 1.806 .591l3.694 -5.091v.055" />
                    <path
                        d="M6 8h15l-3.5 7l-7.1 -.747a4 4 0 0 1 -3.296 -2.493l-2.853 -7.13a1 1 0 0 0 -.928 -.63h-1.323" />
                </svg>
                <span class="product-count">0</span>
            </button>
        </nav>


        <dialog class="product-modal">
            <button class="product-close-modal">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-x">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M18 6l-12 12" />
                    <path d="M6 6l12 12" />
                </svg>
            </button>
            <div>Cart</div>
            <p>some text</p>
            <a href="cart.html">Proceed to cart</a>
        </dialog>
    </header>
    <div class="products-wrapper">
        <ul class="products">
        </ul>
    </div>
    </div>

    <template id="product-card-tmp">
        <li class="product">
            <div class="product-media">
                <a href="product.html" class="product-link">
                    <img class="product-image" src="" alt="">
                </a>
            </div>
            <div class="product-info">
                <h3 class="product-title"></h3>
                <div class="product-price-and-qty">
                    <span class="product-price"></span>
                    <div class="product-quantity-wr">
                        <button class="product-minus"> - </button>
                        <input type="number" class="product-quantity" min="1" value="1">
                        <button class="product-plus"> + </button>
                    </div>
                </div>
                <button class="product-add">Add to cart
                </button>
            </div>
        </li>
    </template>

    <script src="script.js"></script>

</body>

</html>
